name: FaultGraph-BX Security & Quality Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # Permiso requerido para subir reportes SARIF a GitHub Code Scanning
  pull-requests: write   # Permiso opcional para comentar sugerencias en PRs

jobs:
  faultgraph-scan:
    name: BoxLang Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install BoxLang CLI
        run: |
          curl -fsSL https://boxlang.io/install.sh | bash
          echo "$HOME/.boxlang/bin" >> $GITHUB_PATH

      - name: Run FaultGraph CI Scanner & SARIF Generation
        run: |
          boxlang ci.bxs --target . --output reports/faultgraph.sarif --fail-on HIGH

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/faultgraph.sarif
          category: faultgraph-bx-analysis
